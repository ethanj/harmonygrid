<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" role="img" aria-labelledby="key-map-title key-map-description">
<title id="key-map-title">Harmony Grid keyboard map</title><desc id="key-map-description">A relational map of the controls: Tab sets root. Q W E R adjust tempo; T toggles the metronome. A S decrement and increment tempo. Y toggles Drone. D repeats, F toggles Sustain, G holds. Command latches keys marked L. C V copy and paste. Hold N or M to collect chords or modes, then release to name. Shift or Caps Lock changes the digit and copy/paste target; both together select chords. Space sustains. Grid-axis arrows are on-screen controls with Set and Cancel.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#e6e9df}.group{fill:#14201a;stroke:#4c6756;stroke-dasharray:3 5}.cap{fill:#26392e;stroke:#7c9c86;stroke-width:1.3}.label{font-size:12px;fill:#b8cabc}.letter{font-size:20px;font-weight:550}.tiny{font-size:11px;fill:#a7baad}.heading{font-size:10px;letter-spacing:1.4px;fill:#a3ddc6;font-weight:650}.latch{font-size:10px;fill:#a3ddc6;font-weight:700}.link{stroke:#6c8d77;fill:none;stroke-width:1.2}</style>
<rect class="group" x="136" y="22" width="370" height="172" rx="12"/><text class="heading" x="152" y="41">TEMPO &amp; PULSE</text>
<rect class="group" x="525" y="113" width="262" height="81" rx="12"/><text class="heading" x="541" y="123">RETAIN &amp; REPEAT</text>
<rect class="group" x="524" y="213" width="365" height="99" rx="12"/><text class="heading" x="540" y="234">COPY &amp; CREATE</text>
<g data-key="Tab"><text class="label" x="66.5" y="59" text-anchor="middle">Set root</text><rect class="cap" x="24" y="67" width="85" height="42" rx="10"/><text class="letter" x="66.5" y="95" text-anchor="middle">Tab</text></g><g data-key="Q"><text class="label" x="179.0" y="59" text-anchor="middle">½</text><rect class="cap" x="152" y="67" width="54" height="42" rx="10"/><text class="letter" x="179.0" y="95" text-anchor="middle">Q</text><text class="latch" x="193" y="80">L</text></g><g data-key="W"><text class="label" x="250.0" y="59" text-anchor="middle">2×</text><rect class="cap" x="223" y="67" width="54" height="42" rx="10"/><text class="letter" x="250.0" y="95" text-anchor="middle">W</text><text class="latch" x="264" y="80">L</text></g><g data-key="E"><text class="label" x="321.0" y="59" text-anchor="middle">⅔</text><rect class="cap" x="294" y="67" width="54" height="42" rx="10"/><text class="letter" x="321.0" y="95" text-anchor="middle">E</text><text class="latch" x="335" y="80">L</text></g><g data-key="R"><text class="label" x="392.0" y="59" text-anchor="middle">³⁄₂</text><rect class="cap" x="365" y="67" width="54" height="42" rx="10"/><text class="letter" x="392.0" y="95" text-anchor="middle">R</text><text class="latch" x="406" y="80">L</text></g><g data-key="T"><text class="label" x="463.0" y="59" text-anchor="middle">On / off</text><rect class="cap" x="436" y="67" width="54" height="42" rx="10"/><text class="letter" x="463.0" y="95" text-anchor="middle">T</text></g><g data-key="Y"><text class="label" x="579.0" y="59" text-anchor="middle">Drone · toggle</text><rect class="cap" x="552" y="67" width="54" height="42" rx="10"/><text class="letter" x="579.0" y="95" text-anchor="middle">Y</text></g><g data-key="A"><text class="label" x="198.0" y="138" text-anchor="middle">−1</text><rect class="cap" x="171" y="146" width="54" height="42" rx="10"/><text class="letter" x="198.0" y="174" text-anchor="middle">A</text></g><g data-key="S"><text class="label" x="269.0" y="138" text-anchor="middle">+1</text><rect class="cap" x="242" y="146" width="54" height="42" rx="10"/><text class="letter" x="269.0" y="174" text-anchor="middle">S</text></g><text class="tiny" x="326" y="164">Hold ratios temporarily.</text><text class="tiny" x="326" y="180">⌘ makes them permanent.</text><g data-key="D"><text class="label" x="571.0" y="138" text-anchor="middle">Repeat</text><rect class="cap" x="544" y="146" width="54" height="42" rx="10"/><text class="letter" x="571.0" y="174" text-anchor="middle">D</text><text class="latch" x="585" y="159">L</text></g><g data-key="F"><text class="label" x="655.0" y="138" text-anchor="middle">Sustain · toggle</text><rect class="cap" x="628" y="146" width="54" height="42" rx="10"/><text class="letter" x="655.0" y="174" text-anchor="middle">F</text></g><g data-key="G"><text class="label" x="739.0" y="138" text-anchor="middle">Hold</text><rect class="cap" x="712" y="146" width="54" height="42" rx="10"/><text class="letter" x="739.0" y="174" text-anchor="middle">G</text><text class="latch" x="753" y="159">L</text></g><g data-key="⌘"><text class="label" x="66.5" y="234" text-anchor="middle">Latch marked keys</text><rect class="cap" x="24" y="242" width="85" height="42" rx="10"/><text class="letter" x="66.5" y="270" text-anchor="middle">⌘</text></g><text class="tiny" x="24" y="301">⌘ + L-marked key</text><rect x="151" y="218" width="331" height="95" rx="10" fill="#1a2920" stroke="#4c6756"/><text class="heading" x="167" y="238">GRID AXES · ON-SCREEN</text><text class="letter" x="175" y="280">←  H  →</text><text class="letter" x="282" y="260">↑</text><text class="label" x="286" y="279">V</text><text class="letter" x="282" y="301">↓</text><text class="tiny" x="330" y="264">1–12 semitones</text><text class="tiny" x="330" y="284">Set / Cancel</text><g data-key="C"><text class="label" x="568.0" y="251" text-anchor="middle">Copy</text><rect class="cap" x="541" y="259" width="54" height="42" rx="10"/><text class="letter" x="568.0" y="287" text-anchor="middle">C</text></g><g data-key="V"><text class="label" x="639.0" y="251" text-anchor="middle">Paste</text><rect class="cap" x="612" y="259" width="54" height="42" rx="10"/><text class="letter" x="639.0" y="287" text-anchor="middle">V</text></g><g data-key="N"><text class="label" x="750.0" y="251" text-anchor="middle">Chord</text><rect class="cap" x="723" y="259" width="54" height="42" rx="10"/><text class="letter" x="750.0" y="287" text-anchor="middle">N</text></g><g data-key="M"><text class="label" x="833.0" y="251" text-anchor="middle">Mode</text><rect class="cap" x="806" y="259" width="54" height="42" rx="10"/><text class="letter" x="833.0" y="287" text-anchor="middle">M</text></g><text class="tiny" x="793" y="326" text-anchor="middle">Hold to collect · release to name</text><g data-key="Shift"><text class="label" x="66.5" y="345" text-anchor="middle">Mode / chord</text><rect class="cap" x="24" y="353" width="85" height="42" rx="10"/><text class="letter" x="66.5" y="381" text-anchor="middle">Shift</text></g><g data-key="Caps"><text class="label" x="162.5" y="345" text-anchor="middle"></text><rect class="cap" x="120" y="353" width="85" height="42" rx="10"/><text class="letter" x="162.5" y="381" text-anchor="middle">Caps</text></g><path class="link" d="M213 374h22m-5-5 5 5-5 5"/><rect x="246" y="351" width="61" height="24" rx="4" fill="#a3ddc6"/><text x="276" y="367" text-anchor="middle" style="fill:#153424;font-size:12px">Mode</text><rect x="310" y="351" width="64" height="24" rx="4" fill="#26392e" stroke="#668770"/><text x="342" y="367" text-anchor="middle" font-size="12">Chord</text><text class="tiny" x="246" y="390">Either selects Mode; both select Chord.</text><text class="tiny" x="246" y="405">0–9 selects the slot.</text><g data-key="Space"><text class="label" x="703.0" y="345" text-anchor="middle">Sustain · hold</text><rect class="cap" x="540" y="353" width="326" height="42" rx="10"/><text class="letter" x="703.0" y="381" text-anchor="middle">Space</text></g></svg>