<!doctype html><meta charset="utf-8"><title>Harmony Grid slot editor</title><link rel="stylesheet" href="../mockup.css"><link rel="stylesheet" href="../authoring/authoring.css"><style>.arrange{height:calc(100vh - 102px)}.detail textarea{width:100%;background:#15241a;color:var(--text);font:inherit;padding:12px;border:1px solid #58725f;border-radius:5px;resize:vertical;min-height:80px}.detail label{display:block;font-size:12px;margin:12px 0 7px}.editor-note{font-size:11px;color:var(--muted);line-height:1.6}.detail .actions{flex-wrap:wrap}.detail{overflow:auto}.intervals{flex-wrap:wrap}.slot-card{min-width:0}.slot-card strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.error{color:var(--amber);font-size:12px;margin:10px 0}.detail input{padding:10px}</style><main id="instrument"></main><footer id="review-bar"></footer><script src="../mockup.js"></script><script src="../authoring/authoring.js"></script><script>(()=>{
const mode=new URLSearchParams(location.search).get('target')==='mode';const detail=document.querySelector('.detail');
detail.innerHTML=`<span class="eyebrow">${mode?'Mode':'Chord'} · slot 6</span><h2>${mode?'Open pent':'Open voicing'}</h2><label>Name</label><input value="${mode?'Open pent':'Open voicing'}"><label>${mode?'Pitch classes from root':'Semitones from lead pitch'}</label><textarea>${mode?'0, 2, 4, 7, 9':'-12, 4, 7, 12'}</textarea><p class="editor-note">${mode?'Use distinct whole numbers from 0 to 11.':'Use distinct whole numbers from -127 to 127. Zero does not need to be included.'}</p><p class="error" hidden>Slot 6: duplicate intervals. Every interval must be distinct.</p><div class="clipboard"><span>Copied ${mode?'chord':'chord'}<br><strong>Major</strong></span><button class="action">Copy</button></div><p class="editor-note">${mode?'A copied chord cannot be pasted into a mode.':'Paste replaces this draft. Apply changes updates the instrument.'}</p><div class="actions"><button class="action" ${mode?'disabled':''}>Paste here</button><button class="action">Cancel</button><button class="action primary">Apply changes</button></div>`;
if(new URLSearchParams(location.search).has('invalid')){detail.querySelector('textarea').value='0, 4, 4, 7';detail.querySelector('.error').hidden=false;}
document.querySelector('.arrange-header p').textContent='Edit names and intervals. Changes stay in this editor until you apply them.';
})();</script>
