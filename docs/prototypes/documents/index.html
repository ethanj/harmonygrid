<!doctype html><meta charset="utf-8"><title>Harmony Grid file states</title><link rel="stylesheet" href="../mockup.css"><link rel="stylesheet" href="../authoring/authoring.css"><style>body{min-height:100vh}.shade{position:fixed;inset:0}.error-card{padding:16px;border:1px solid #96734c;border-radius:5px;background:#2c2920;line-height:1.6}.dialog{max-height:calc(100vh - 64px)}.dialog-body{overflow:auto}.dialog-foot{flex:none}.file-name{font-size:20px;margin:10px 0 20px}.note-banner{line-height:1.6}</style><div id="instrument"></div><div id="review-bar"></div><script src="../mockup.js"></script><script>
(()=>{const state=new URLSearchParams(location.search).get('state')||'first';
